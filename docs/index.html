<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEFDF8">
<meta name="description" content="Read PDFs aloud and catch the ideas they spark.">
<title>CitySteps Reader</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-aa" viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M4.8 14.5h6.4M14 19l3.5-9 3.5 9M15 16.5h5"/></symbol>
  <symbol id="i-page" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6M11 8v6"/></symbol>
</svg>

<!-- Library -->
<section id="libraryView">
  <header class="bar">
    <h1 class="wordmark"><span class="lane" aria-hidden="true"></span>CitySteps Reader</h1>
    <button class="icon-btn" id="libMenuBtn" aria-label="More"><svg><use href="#i-more"/></svg></button>
  </header>
  <main class="library">
    <div id="banners"></div>
    <button class="add-card" id="addBtn">
      <span class="plus"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg></span>
      <span><b>Add a PDF</b><span>Or share one here from Drive, Gmail or Chrome</span></span>
    </button>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
    <ul class="doc-list" id="docList"></ul>
    <div class="empty" id="emptyState" hidden>
      <div class="big">Nothing to read yet</div>
      Add a paper, a staff report or an article. It gets cleaned up once and stays on this phone.
    </div>
  </main>
</section>

<!-- Reader -->
<section id="readerView" class="reader-wrap" hidden>
  <header class="bar">
    <button class="icon-btn" id="backBtn" aria-label="Back to library"><svg><use href="#i-back"/></svg></button>
    <h1 id="docTitle"></h1>
    <button class="icon-btn" id="sectionsBtn" aria-label="Sections"><svg><use href="#i-list"/></svg></button>
    <button class="icon-btn" id="prefsBtn" aria-label="Reading and listening settings"><svg><use href="#i-aa"/></svg></button>
  </header>
  <article class="reader" id="reader" aria-live="off"></article>
  <footer class="player" id="player">
    <div class="where" id="where"></div>
    <div class="row">
      <button class="speed" id="speedBtn" aria-label="Reading speed">1.0×</button>
      <button class="icon-btn" id="prevBtn" aria-label="Previous sentence"><svg><use href="#i-prev"/></svg></button>
      <button class="play" id="playBtn" aria-label="Play"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="nextBtn" aria-label="Next sentence"><svg><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="pageBtn" aria-label="Show the original page"><svg><use href="#i-page"/></svg></button>
    </div>
  </footer>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="pageview" id="pageview" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>window.CSREADER_BUILD={"v":"0.2.0","commit":"6a2c9b0+","date":"2026-09-23"};</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
